<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #060607; overflow: hidden; color: #d8d2bd; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
      #stage { position: fixed; inset: 0 0 34px 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { background: #060607; display: block; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #060607; z-index: 5; }
      #loading h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: 0.12em; }
      #loading p { margin: 0; font-size: 14px; color: #8d8878; }
      #bar { width: min(420px, 70vw); height: 6px; background: #1a1a1c; border: 1px solid #3a372e; }
      #fill { width: 0%; height: 100%; background: #b8914a; transition: width 0.15s linear; }
      #fs { position: fixed; right: 10px; bottom: 4px; z-index: 6; height: 26px; padding: 0 12px; font-size: 13px; color: #b6b09c; background: rgba(10,10,12,0.7); border: 1px solid #3a372e; cursor: pointer; opacity: 0.55; }
      #fs:hover { opacity: 1; }
      #warn { display: none; position: fixed; inset: 0; z-index: 9; background: #060607; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 18px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="warn">이 게임은 마우스로 하는 PC용입니다.<br>PC 브라우저(Chrome·Edge·Firefox)에서 다시 열어 주세요.</div>
    <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading"><h1>마인 (가제)</h1><div id="bar"><div id="fill"></div></div><p id="msg">불러오는 중… 처음에는 시간이 걸립니다</p></div>
    <button id="fs" type="button">전체 화면</button>
    <script src="Build/WebBuild-cardboard.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) { document.getElementById("warn").style.display = "flex"; }
      function fit() {
        var w = window.innerWidth, h = window.innerHeight - 34; var cw = Math.min(w, h * 16 / 9), ch = cw * 9 / 16;
        canvas.style.width = Math.floor(cw) + "px"; canvas.style.height = Math.floor(ch) + "px";
      }
      window.addEventListener("resize", fit); fit();
      document.getElementById("fs").onclick = function () { var el = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen(); };
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebBuild-cardboard.data.unityweb",
        frameworkUrl: "Build/WebBuild-cardboard.framework.js.unityweb",
        codeUrl: "Build/WebBuild-cardboard.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Mine",
        productVersion: "1.0",
      }, function (p) { document.getElementById("fill").style.width = Math.round(p * 100) + "%"; if (p >= 0.99) document.getElementById("msg").textContent = "시작하는 중…"; })
      .then(function () { document.getElementById("loading").style.display = "none"; canvas.focus(); })
      .catch(function (m) { document.getElementById("msg").textContent = "불러오지 못했습니다: " + m; });
    </script>
  </body>
</html>
